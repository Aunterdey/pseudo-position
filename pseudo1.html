<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pseudo type html korbo</title>
    <style>
        h3{
            color: aqua;
        }
        h3:hover{
            color: blueviolet;
            background-color: beige;
        }
        input:focus{
            color: mediumspringgreen;
            border: 1px solid maroon;
            outline: 0px;
            padding-left: 9px;
        }
        a:visited{
            color: red;
        }
      
      li:nth-child(2n){
        color: blue;
      }
      li:last-child{
        color: yellowgreen;
      }  
    </style>
</head>
<body>
    <h3>This is pseudo type website</h3>
    
    <input type="text"><br>
    <input type="text"><br>
    <input type="text">
    
    <br>
    <a href="https://www.google.com/">google</a><br>
    <a href="https://www.mentimeter.com/">menemeter</a>
    <ul>
        <li>AUTER</li>
        <li>NIPA</li>
        <li>MITHU</li>
        <li>DIGANTA</li>
    </ul>
</body>
</html>
